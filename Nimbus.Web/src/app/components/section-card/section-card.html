<div class="card" [class.active-border]="expanded()">
  <div class="card-header">
  <button
    (click)="toggle()"
    [attr.aria-controls]="bodyId()"
    [attr.aria-expanded]="expanded()"
    class="card-head"
    type="button"
  >
    <span class="sec-num">{{ orderLabel() }}</span>
    <span [class]="'dot ' + status()" aria-hidden="true"></span>
    <span class="sec-title">{{ title() }}</span>
    @if (badge(); as b) {
      <span class="badge" [class.from-draft]="b === 'from-draft'" data-testid="section-badge">
        <span class="badge-dot" aria-hidden="true">●</span>
        <span class="badge-text">{{ b === 'from-draft' ? 'FROM DRAFT' : 'EDITED' }}</span>
      </span>
    }
    <span class="spacer"></span>
    @if (summary(); as text) {
      <span class="sec-meta" data-testid="section-summary">{{ text }}</span>
    }
  </button>
  <!-- An action that belongs to the section (e.g. "Fetch" on Meteo) sits in the header, beside, never inside, the toggle button. -->
  <ng-content select="[card-action]" />
  <!-- Mouse target only: the toggle button above is the one keyboard and screen-reader users get. -->
  <button (click)="toggle()" aria-hidden="true" class="chev-btn" tabindex="-1" type="button">
    <i [class.ti-chevron-down]="!expanded()" [class.ti-chevron-up]="expanded()" aria-hidden="true" class="ti chev"></i>
  </button>
  </div>
  @if (expanded()) {
    <div [id]="bodyId()" class="card-body">
      <ng-content />
    </div>
  }
</div>
