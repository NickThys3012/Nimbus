<div class="bars">
  @for (i of bars; track i) {
    <span [style.background]="i < score() ? color() : 'var(--ln2)'"></span>
  }
</div>
<div aria-live="polite" class="strength-txt">Strength {{ label() }}</div>
<ul class="rules">
  @for (rule of rules(); track rule.text) {
    <li [class.met]="rule.met">
      <i aria-hidden="true" class="ti" [class.ti-circle-check]="rule.met" [class.ti-circle]="!rule.met"></i>{{ rule.text }}
    </li>
  }
</ul>
