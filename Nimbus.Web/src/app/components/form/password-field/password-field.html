<div class="field pw-row">
  <label>PASSWORD</label>
  <input class="fi" [type]="fieldType()" id="pw-reg" [placeholder]="placeholder()" [value]="value()" (input)="onInput($event)" >
  <button class="pw-toggle" data-target="pw-reg" aria-label="Show password" (click)="showPassword.set(!showPassword())"><i class="ti ti-eye" aria-hidden="true"></i></button>
</div>
