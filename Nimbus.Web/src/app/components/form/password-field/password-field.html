<div [class.error]="showError()" class="field pw-row">
  <label [for]="fieldId()">{{ label() }}</label>
  @if (control()) {
    <input [formControl]="control()!" [placeholder]="placeholder()" [type]="fieldType()" class="fi" [id]="fieldId()">
  } @else {
    <input (input)="onInput($event)" [placeholder]="placeholder()" [type]="fieldType()" [value]="value()" class="fi" [id]="fieldId()">
  }
  <button (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" class="pw-toggle" [attr.data-target]="fieldId()" type="button"><i aria-hidden="true" class="ti" [class.ti-eye]="!showPassword()" [class.ti-eye-off]="showPassword()"></i></button>
  <div class="err-msg">{{ errorMessage() }}</div>
</div>
