<div class="field" [class.error]="showError()">
  <label>{{label()}}</label>
  @if (control()) {
    <input class="fi" [formControl]="control()!" [type]="type()" [placeholder]="placeholder()" />
  } @else {
    <input class="fi" [type]="type()" [placeholder]="placeholder()" [value]="value()" (input)="onInput($event)" />
  }
  <div class="err-msg">{{ errorMessage() }}</div>
</div>
