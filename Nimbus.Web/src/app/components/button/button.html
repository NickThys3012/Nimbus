<button
  [class.btn-auto]="!fullWidth()"
  [class.btn-ghost]="variant() === 'ghost'"
  [class.btn-primary]="variant() === 'primary'"
  [disabled]="disabled()"
  [id]="id()"
  [type]="type()"
  class="btn"
>
  @if (icon() !== null) {
    <i aria-hidden="true" class="ti {{icon()}}"></i>
  }
  <ng-content/>
</button>
