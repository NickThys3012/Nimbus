@if (point()) {
  <div #map class="map" data-testid="location-map" role="img" [attr.aria-label]="'Map preview at ' + point()![0] + ', ' + point()![1]"></div>
} @else {
  <div class="placeholder" data-testid="location-map-empty"><i class="ti ti-map-off" aria-hidden="true"></i><span data-testid="location-map-reason">NO PIN · {{ reason() }}</span></div>
}
