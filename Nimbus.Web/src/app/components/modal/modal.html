@if (isOpen()) {
  <div
    (click)="onBackdropClick($event)"
    (keydown.enter)="onBackdropEnter($event)"
    (keydown.space)="onBackdropSpace($event)"
    class="modal-backdrop"
    [class.sheet]="sheet()"
    tabindex="-1"
  >
    <div
      (keydown)="onKeydown($event)"
      [attr.aria-describedby]="description() ? descriptionId : null"
      [attr.aria-labelledby]="titleId"
      [attr.role]="alert() ? 'alertdialog' : 'dialog'"
      aria-modal="true"
      class="modal"
      [class.w-narrow]="width() === 'narrow'"
      [class.w-confirm]="width() === 'confirm'"
      tabindex="-1"
    >
      <ng-content select="[modal-icon]" />
      <div [id]="titleId" class="hd">{{ title() }}</div>
      @if (description()) {
        <div [id]="descriptionId" class="lede">{{ description() }}</div>
      }
      <ng-content select="[modal-body]" />
      <div class="modal-actions">
        <ng-content select="[modal-actions]" />
      </div>
    </div>
  </div>
}
