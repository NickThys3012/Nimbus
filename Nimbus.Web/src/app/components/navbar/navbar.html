<div class="app-topbar">
  <div class="brand">
    <Nimbus-logo></Nimbus-logo>
    <span class="wordmark">Nimbus</span>
  </div>
  <div class="nav-links desktop-only">
    @for (item of visibleNavItems(); track item.label) {
      <a [routerLinkActiveOptions]="{ exact: true }" [routerLink]="item.route" class="nav-link" routerLinkActive="on">
        <i [class]="'ti ' + item.icon" aria-hidden="true"></i> {{ item.label }}
      </a>
    }
  </div>
  <div class="actions">
    <Nimbus-icon-button
      (pressed)="themeService.toggle()"
      [icon]="themeService.isDarkMode() ? 'ti-moon' : 'ti-sun'"
      ariaLabel="Change theme"
    ></Nimbus-icon-button>
    @if (authStore.isAuthenticated()) {
      <Nimbus-avatar></Nimbus-avatar>
    } @else {
      <div class="cta">
        <Nimbus-button (click)="router.navigate(['/login'])" [fullWidth]="false" id="btn-sign-in" type="button" variant="ghost">Sign in</Nimbus-button>
        <Nimbus-button (click)="router.navigate(['/login/register'])" [fullWidth]="false" id="btn-request-account" type="button" variant="primary">Sign up</Nimbus-button>
      </div>
      <Nimbus-icon-button
        (pressed)="menuOpen.set(true)"
        [ariaExpanded]="menuOpen()"
        ariaControls="sheet"
        ariaLabel="Open menu"
        class="burger"
        icon="ti-menu-2"
        id="burger"
      ></Nimbus-icon-button>
    }
  </div>
</div>
<Nimbus-mobile-menu [menuOpen]="menuOpen" [navItems]="visibleNavItems()"></Nimbus-mobile-menu>
@if (authStore.isAuthenticated()) {
  <div class="bottom-tabbar">
    @for (item of visibleNavItems(); track item.label) {
      <a [routerLinkActiveOptions]="{ exact: true }" [routerLink]="item.route" class="tab-item" routerLinkActive="on">
        <i [class]="'ti ' + item.icon" aria-hidden="true"></i>{{ item.label }}
      </a>
    }
  </div>
}
