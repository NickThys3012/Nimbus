<div [formGroup]="group()">
  <div class="field">
    <div class="label-row">
      <span class="label-like" id="fp-pax-briefing-label">BRIEFING TEXT</span>
      @if (custom()) {
        <span class="badge custom" data-testid="pax-briefing-custom-badge">CUSTOMIZED FOR THIS FLIGHT</span>
      } @else {
        <span class="badge" data-testid="pax-briefing-standard-badge">STANDARD BRIEFING · v{{ templateVersion }}</span>
      }
    </div>
    <quill-editor
      aria-labelledby="fp-pax-briefing-label"
      class="editor"
      data-testid="pax-briefing-text"
      format="html"
      formControlName="paxBriefingText"
      placeholder="Write the passenger safety briefing…"
      theme="snow"
      [formats]="formats"
      [modules]="modules"
      [sanitize]="true"
    />
  </div>

  <div class="actions">
    <Nimbus-button
      data-testid="pax-briefing-reset"
      icon="ti-restore"
      id="pax-briefing-reset"
      size="sm"
      type="button"
      variant="ghost"
      [disabled]="!custom()"
      [fullWidth]="false"
      (click)="reset()"
    >Reset to template</Nimbus-button>
  </div>

  <div class="field preview">
    <span class="label-like">PREVIEW · AS PASSENGERS WILL READ IT</span>
    <div class="preview-box" data-testid="pax-briefing-preview">
      <Nimbus-rich-text-view [html]="text()" />
    </div>
  </div>
</div>
