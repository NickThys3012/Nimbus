<div [formGroup]="formGroup()" class="field-grid">
  <div class="field">
    <label for="fp-flight-date">DATE *</label>
    <input id="fp-flight-date" data-testid="flight-date" formControlName="flightDate" type="date" />
  </div>
  <div class="field">
    <label for="fp-flight-time">TIME *</label>
    <input id="fp-flight-time" data-testid="flight-time" formControlName="flightTime" type="time" />
  </div>
  <div class="field">
    <label for="fp-balloon">BALLOON *</label>
    <select id="fp-balloon" data-testid="balloon" formControlName="balloonId">
      <option value="">Select a balloon</option>
      @for (b of balloons(); track b.id) {
        <option [value]="b.id">{{ b.registration }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="fp-pilot">PILOT *</label>
    <select id="fp-pilot" data-testid="pilot" formControlName="pilotId">
      <option value="">Select a pilot</option>
      @for (p of pilots(); track p.id) {
        <option [value]="p.id">{{ p.name }}</option>
      }
    </select>
  </div>
</div>
<div class="field-grid">
  <div class="field" style="grid-column: span 2;">
    <label for="fp-location">LAUNCH LOCATION *</label>
    <select id="fp-location" data-testid="launch-location" formControlName="launchLocationId">
      <option value="">Select a location</option>
      @for (l of locations(); track l.id) {
        <option [value]="l.id">{{ l.name }}</option>
      }
    </select>
  </div>
  <div class="field">
    <label for="fp-sunrise">SUNRISE</label>
    <input id="fp-sunrise" data-testid="sunrise" formControlName="sunriseTime" type="time" />
  </div>
  <div class="field">
    <label for="fp-sunset">SUNSET</label>
    <input id="fp-sunset" data-testid="sunset" formControlName="sunsetTime" type="time" />
  </div>
</div>
<label class="check-row">
  <input data-testid="field-owner-notified" formControlName="fieldOwnerNotified" type="checkbox" />
  Field owner notified
</label>
