<div [formGroup]="group()">
  <fieldset class="check-group">
    <legend>SAFETY &amp; COMMS</legend>
    @for (check of safetyChecks; track check.key) {
      <div class="tri-row" role="radiogroup" [attr.aria-label]="check.label">
        <span class="tri-label">{{ check.label }}</span>
        <span class="tri-options">
          @for (answer of answers; track answer) {
            <label class="tri-option">
              <input
                [attr.data-testid]="check.key + '-' + answer"
                [formControlName]="check.key"
                [name]="check.key"
                [value]="answer"
                type="radio"
              />
              {{ answerLabels[answer] }}
            </label>
          }
        </span>
      </div>
    }
  </fieldset>
  <fieldset class="check-group">
    <legend>TECHNICAL CHECK</legend>
    @for (check of technicalChecks; track check.key) {
      <label class="check-row">
        <input [attr.data-testid]="check.key" [formControlName]="check.key" type="checkbox" />
        {{ check.label }}
      </label>
    }
  </fieldset>
</div>
