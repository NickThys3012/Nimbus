<div class="body">
  <div class="card">
    <Nimbus-glyph icon="ti-mail-opened"/>
    <div class="hd">Verify your email address</div>
    <div class="lede">We sent a confirmation link to <strong>{{ emailAddress }}</strong>. Please verify your address first, then an administrator will review your request.</div>
    <Nimbus-button (click)="resendVerificationEmail()" [disabled]="authStore.isLoading()" icon="ti-refresh" id="reverify-btn" type="button" variant="ghost">Try again</Nimbus-button>
    <div class="footer-note">Step 1 of 2 · Verify, then approval</div>
  </div>
</div>
