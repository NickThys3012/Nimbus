<div class="body">
  <div class="card">
    <div class="brand">
      <Nimbus-logo size="lg" />
      <div class="nm">Nimbus</div>
      <div class="sub">flight preparation</div>
    </div>

    <div class="tabs">
      <div (click)="activeTab.set('login')" [class.on]="showLogin()" class="tab" data-panel="p-login" type="button">Sign in</div>
      <div (click)="activeTab.set('register')" [class.on]="!showLogin()" class="tab" data-panel="p-register" type="button">Create account</div>
    </div>

    @if (showLogin()) {
      <!-- login -->
      <Nimbus-login></Nimbus-login>
    } @else {
      <!-- register -->
      <Nimbus-register></Nimbus-register>
    }
    <div class="footer-note">v1.0 · Nimbus</div>
  </div>
</div>
