<div class="wrap">
  <Nimbus-tabs [tabs]="tabs" [active]="tab()" (activeChange)="setTab($event)" label="Settings sections"></Nimbus-tabs>

  <div id="panel-profile" role="tabpanel" aria-labelledby="tab-profile" [hidden]="tab() !== 'profile'">
    @if (tab() === 'profile') {
      <p class="note" data-testid="profile-placeholder">Profile settings are coming soon.</p>
    }
  </div>

  <div id="panel-balloons" role="tabpanel" aria-labelledby="tab-balloons" [hidden]="tab() !== 'balloons'">
    @if (tab() === 'balloons') {
      <Nimbus-balloons></Nimbus-balloons>
    }
  </div>

  <div id="panel-pilots" role="tabpanel" aria-labelledby="tab-pilots" [hidden]="tab() !== 'pilots'">
    @if (tab() === 'pilots') {
      <Nimbus-pilots></Nimbus-pilots>
    }
  </div>

  <div id="panel-launch-locations" role="tabpanel" aria-labelledby="tab-launch-locations" [hidden]="tab() !== 'launch-locations'">
    @if (tab() === 'launch-locations') {
      <Nimbus-launch-locations></Nimbus-launch-locations>
    }
  </div>

  <div id="panel-go-no-go" role="tabpanel" aria-labelledby="tab-go-no-go" [hidden]="tab() !== 'go-no-go'">
    @if (tab() === 'go-no-go') {
      <Nimbus-go-no-go></Nimbus-go-no-go>
    }
  </div>

  <div id="panel-ofp" role="tabpanel" aria-labelledby="tab-ofp" [hidden]="tab() !== 'ofp'">
    @if (tab() === 'ofp') {
      <Nimbus-ofp></Nimbus-ofp>
    }
  </div>

  <div id="panel-preferences" role="tabpanel" aria-labelledby="tab-preferences" [hidden]="tab() !== 'preferences'">
    @if (tab() === 'preferences') {
      <p class="note" data-testid="preferences-placeholder">Preferences are coming soon.</p>
    }
  </div>
</div>
