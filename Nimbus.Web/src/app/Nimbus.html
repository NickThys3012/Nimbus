<div class="app-shell">
  <Nimbus-navbar></Nimbus-navbar>

  <main class="app-content">
    @if (authStore.isAccessRejected()) {
      <Nimbus-account-status status="rejected"></Nimbus-account-status>
    } @else if (authStore.isPendingApproval()) {
      <Nimbus-account-status status="pending"></Nimbus-account-status>
    } @else {
      <router-outlet />
    }
  </main>
</div>
