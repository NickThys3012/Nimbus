name: nimbus

services:
  # ---------------------------------------------------------------- front door
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      NIMBUS_DOMAIN: ${NIMBUS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      MINIO_CONSOLE_USER: ${MINIO_CONSOLE_USER}
      MINIO_CONSOLE_PASSWORD_HASH: ${MINIO_CONSOLE_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/nimbus/data/caddy/data:/data
      - /srv/nimbus/data/caddy/config:/config
    networks: [nimbus]

  # ------------------------------------------------- application (profile: app)
  api:
    profiles: ["app"]
    image: ghcr.io/nickthys3012/nimbus-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose: ["8080"]
    env_file: [.env]
    environment:
      # Maps the .env MinIO credentials (issue #95) onto the Storage:* config keys the API
      # binds StorageOptions from (issue #11) — ASP.NET Core config maps `__` to `:`.
      Storage__Endpoint: http://minio:9000
      Storage__AccessKey: ${MINIO_APP_ACCESS_KEY}
      Storage__SecretKey: ${MINIO_APP_SECRET_KEY}
      Storage__ForcePathStyle: "true"
      Storage__UseHttps: "false"
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks: [nimbus]

  migrator:
    profiles: ["app"]
    image: ghcr.io/nickthys3012/nimbus-migrator:${IMAGE_TAG:-latest}
    restart: on-failure
    env_file: [.env]
    depends_on:
      - sqlserver
    networks: [nimbus]

  # ------------------------------------------------ placeholder (profile: stub)
  api-stub:
    profiles: ["stub"]
    image: traefik/whoami:latest
    restart: unless-stopped
    command: ["--port", "8080"]
    networks:
      nimbus:
        aliases:
          - api
    # The alias means Caddy's "api:8080" resolves here while the real API
    # does not exist. Nothing in Caddyfile needs to change later.

  # ----------------------------------------------------------------- data tier
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB}
    volumes:
      - /srv/nimbus/data/mssql:/var/opt/mssql
    # Memory/CPU ceilings live in docker-compose.limits.yml (issue #103), not here,
    # so the budget stays in one place. Deploy with both files layered.
    networks: [nimbus]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    user: "1000:1000"
    # No ports: published — reachable only on the internal `nimbus` network.
    # The console is exposed to the outside world exclusively through Caddy's
    # authenticated console.$NIMBUS_DOMAIN route (see Caddyfile) — see #95.
    command: server /data --console-address ":9001"
    environment:
      # Root credentials only: generated at deploy time (never defaulted), and
      # never the credentials the application authenticates with (see minio-init).
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Lets the bundled `mc` binary resolve the `local` alias for the healthcheck
      # below without a separate `mc alias set` step.
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9000
    volumes:
      - /srv/nimbus/data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [nimbus]

  # One-shot, idempotent bucket/policy/app-user bootstrap (issue #95). Safe to
  # re-run on every `docker compose up` — see infra/minio-init.sh.
  minio-init:
    image: minio/mc:latest
    restart: "no"
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY}
    volumes:
      - ./minio-init.sh:/init/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks: [nimbus]

  # -------------------------------------------------------------- observability
  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - /srv/nimbus/data/loki:/loki
    networks: [nimbus]

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      # Retention is decided together with the 1536M memory ceiling in
      # docker-compose.limits.yml (issue #103): Prometheus' footprint scales with
      # active series and retention, not traffic. 15 days / 8 GB keeps it inside
      # the ~10 GB disk budget documented in RESOURCE-BUDGET.md.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=8GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - /srv/nimbus/data/prometheus:/prometheus
    networks: [nimbus]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.textfile.directory=/host/var/lib/node_exporter/textfile_collector'
    volumes:
      - /:/host:ro,rslave
    networks: [nimbus]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${NIMBUS_DOMAIN}
      GF_SERVER_DOMAIN: grafana.${NIMBUS_DOMAIN}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
    volumes:
      - /srv/nimbus/data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [nimbus]

networks:
  nimbus:
    driver: bridge